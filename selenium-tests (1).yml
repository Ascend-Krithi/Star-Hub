name: StarHub Automation - Selenium Tests

on:
  push:
    branches:
      - 'Feature-*'

jobs:
  selenium-test-run:
    name: Selenium TestNG - ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout the Feature branch ───────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Java 11 ────────────────────────────────────────────────
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      # ── 3. Install Google Chrome ─────────────────────────────────────────
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
            | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # ── 4. Verify committed files exist before build ─────────────────────
      - name: Verify project structure
        run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo ""
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== Full source tree ==="
          find src -type f | sort
          echo ""
          echo "--- Key file checks ---"
          test -f pom.xml                                                          && echo "OK pom.xml"           || echo "MISSING pom.xml"
          test -f src/test/resources/testng.xml                                    && echo "OK testng.xml"        || echo "MISSING testng.xml"
          test -f src/test/java/com/sh/automation/base/BaseTest.java               && echo "OK BaseTest.java"     || echo "MISSING BaseTest.java"
          test -f src/test/java/com/sh/automation/pages/HomePage.java              && echo "OK HomePage.java"     || echo "MISSING HomePage.java"
          test -f src/test/java/com/sh/automation/pages/AllPhonesPage.java         && echo "OK AllPhonesPage.java"     || echo "MISSING AllPhonesPage.java"
          test -f src/test/java/com/sh/automation/pages/DeviceDetailPage.java      && echo "OK DeviceDetailPage.java"  || echo "MISSING DeviceDetailPage.java"
          test -f src/test/java/com/sh/automation/pages/LoginPopupPage.java        && echo "OK LoginPopupPage.java"     || echo "MISSING LoginPopupPage.java"
          echo ""
          echo "=== Test classes found ==="
          find src/test/java/com/sh/automation/tests -name "*.java" | sort

      # ── 5. Run Maven tests ────────────────────────────────────────────────
      - name: Run mvn clean test
        env:
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
          TEST_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
        run: |
          mvn clean test \
            -Dheadless=true \
            -Dbrowser=chrome \
            -DsuiteXmlFile=src/test/resources/testng.xml \
            -Dmaven.test.failure.ignore=true \
            --no-transfer-progress

      # ── 6. Upload surefire + TestNG reports ───────────────────────────────
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/testng-results.xml
            target/test-output/
          retention-days: 30
          if-no-files-found: ignore

      # ── 7. Upload screenshots on failure ──────────────────────────────────
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.ref_name }}-${{ github.run_number }}
          path: target/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      # ── 8. Publish results in GitHub Actions UI ───────────────────────────
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results - ${{ github.ref_name }}
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      # ── 9. Summary in job log ─────────────────────────────────────────────
      - name: Print test summary
        if: always()
        run: |
          echo "============================================"
          echo " Branch     : ${{ github.ref_name }}"
          echo " Commit     : ${{ github.sha }}"
          echo " Run number : ${{ github.run_number }}"
          echo "============================================"
          RESULT_FILE="target/surefire-reports/testng-results.xml"
          if [ -f "$RESULT_FILE" ]; then
            PASSED=$(grep -o  'passed="[0-9]*"'  "$RESULT_FILE" | head -1 | grep -o '[0-9]*')
            FAILED=$(grep -o  'failed="[0-9]*"'  "$RESULT_FILE" | head -1 | grep -o '[0-9]*')
            SKIPPED=$(grep -o 'skipped="[0-9]*"' "$RESULT_FILE" | head -1 | grep -o '[0-9]*')
            echo " Passed  : ${PASSED:-0}"
            echo " Failed  : ${FAILED:-0}"
            echo " Skipped : ${SKIPPED:-0}"
          else
            echo " No result file found - check Maven output above."
          fi
          echo "============================================"
